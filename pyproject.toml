[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klayout_mcp"
version = "1.0.0"
description = "A Model Context Protocol server for KLayout API integration"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.8"
authors = [
    { name = "Lewis Liu" }
]
keywords = ["klayout", "mcp", "eda", "chip-design", "layout", "vlsi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.0.0",
    "markdown-it-py>=3.0.0",
    "python-frontmatter>=1.0.0",
]

[project.optional-dependencies]
standalone = [
    "klayout>=0.28.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
]
all = [
    "klayout>=0.28.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
]

[project.scripts]
klayout-mcp = "src.server:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/klayout_mcp"
Repository = "https://github.com/YOUR_USERNAME/klayout_mcp"
Documentation = "https://github.com/YOUR_USERNAME/klayout_mcp/blob/main/README.md"

# IMPORTANT: Include data files in the wheel
[tool.hatch.build.targets.wheel]
packages = ["src"]
include = [
    "data/api_index.json",
    "klayout-doc/markdown_docs/**/*",
]

[tool.hatch.build.targets.wheel.force-include]
"data" = "data"
"klayout-doc" = "klayout-doc"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.hatch.metadata]
allow-direct-references = true
